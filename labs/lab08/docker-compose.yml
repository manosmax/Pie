services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - smartbin-net

  producer:
    build: .
    command: python producer.py --verbose --host mosquitto
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      - ./data:/app/data
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  consumer:
    build: .
    command: >
      python consumer.py
      --verbose
      --host mosquitto
      --topic smartbin/bin-01/pir-01/events
      --out /app/data/motion_events.jsonl
    volumes:
      - ./data:/app/data
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  api:
    build: .
    command: python api.py
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - MQTT_BROKER=mosquitto
    networks:
      - smartbin-net
    depends_on:
      - mosquitto


networks:
  smartbin-net:
    driver: bridge