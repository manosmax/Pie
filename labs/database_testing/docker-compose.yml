services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - smartbin-net

  # ── Bin 01 — real PIR sensor (GPIO) ────────────────────────────────────────
  producer:
    build: .
    command: python producer.py --verbose --host mosquitto
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      - ./data:/app/data
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  consumer:
    build: .
    command: >
      python consumer.py
      --verbose
      --host mosquitto
      --topic smartbin/bin-01/pir-01/events
      --out /app/data/motion_events.jsonl
    volumes:
      - ./data:/app/data
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  # ── Bin 02 — virtual PIR sensor (simulated) ────────────────────────────────
  producer_bin02:
    build: .
    command: >
      python virtual_producer_bin02.py
      --verbose
      --host mosquitto
      --bin-id bin-02
      --sensor-id pir-02
      --topic smartbin/bin-02/pir-02/events
      --event-interval 15
      --jitter 5
    volumes:
      - ./data:/app/data
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  consumer_bin02:
    build: .
    command: >
      python consumer.py
      --verbose
      --host mosquitto
      --topic smartbin/bin-02/pir-02/events
      --out /app/data/motion_events_bin02.jsonl
    volumes:
      - ./data:/app/data
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  # ── Shared services ─────────────────────────────────────────────────────────
  api:
    build: .
    command: python api.py
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./models_v_s:/app/models_v_s
    environment:
      - MQTT_BROKER=mosquitto
      - DB_PATH=/app/data/smartbin.db
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  train_model:
    build: .
    command: python train_model.py --output-dir /app/models_v_s --db-path /app/data/smartbin.db
    restart: on-failure
    volumes:
      - ./data:/app/data
      - ./models_v_s:/app/models_v_s
    networks:
      - smartbin-net
    depends_on:
      - mosquitto

  # ── Virtual sensors — Bin 01 ────────────────────────────────────────────────
  virtual_sensor_rules:
    build: .
    command: python virtual_sensor_rules.py --broker mosquitto
    networks:
      - smartbin-net
    depends_on:
      - mosquitto
      - producer

  virtual_sensor_ml:
    build: .
    command: >
      python virtual_sensor_ml.py
      --broker mosquitto
      --model-path /app/models_v_s/busy_predictor.joblib
    volumes:
      - ./models_v_s:/app/models_v_s
    networks:
      - smartbin-net
    depends_on:
      - mosquitto
      - producer

  # ── Virtual sensors — Bin 02 ────────────────────────────────────────────────
  virtual_sensor_rules_bin02:
    build: .
    command: >
      python virtual_sensor_rules.py
      --broker mosquitto
      --bin-id bin-02
      --subscribe-topic smartbin/bin-02/pir-02/events
      --publish-topic smartbin/bin-02/usage
    networks:
      - smartbin-net
    depends_on:
      - mosquitto
      - producer_bin02

  virtual_sensor_ml_bin02:
    build: .
    command: >
      python virtual_sensor_ml.py
      --broker mosquitto
      --bin-id bin-02
      --publish-topic smartbin/bin-02/prediction
      --model-path /app/models_v_s/busy_predictor.joblib
    volumes:
      - ./models_v_s:/app/models_v_s
    networks:
      - smartbin-net
    depends_on:
      - mosquitto
      - producer_bin02

networks:
  smartbin-net:
    driver: bridge
